# Vite SPA served straight off nginx (no proxy in front — see docker-compose.yml).
#
# Two caching regimes: the shell must always be revalidated so a deploy is picked up on a
# normal reload, while Vite's content-hashed /assets/* filenames are immutable and can be
# cached for a year.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # text/html is always gzipped by nginx and must not be listed here. nginx >= 1.21.1 maps
    # .js to text/javascript, older builds to application/javascript, so both are listed.
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # nginx drops every inherited add_header the moment a block declares one of its own, so
    # these two are repeated verbatim in each location below that sets a header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The SPA shell. Both the `index` directive and the try_files fallback below reach this
    # location by internal redirect, so deep links like /accounts/1 are covered too.
    # "no-cache" means "revalidate", not "don't store" — a 304 is still allowed, so this is cheap.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Vite content-hashes these filenames, so changed content is always a changed URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
