# Vite SPA served straight off nginx (no proxy in front — see docker-compose.yml).
#
# Two caching regimes: the shell must always be revalidated so a deploy is picked up on a
# normal reload, while Vite's content-hashed /assets/* filenames are immutable and can be
# cached for a year.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # text/html is always gzipped by nginx and must not be listed here. nginx >= 1.21.1 maps
    # .js to text/javascript, older builds to application/javascript, so both are listed.
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # nginx drops every inherited add_header the moment a block declares one of its own, so
    # these are repeated verbatim in each location below that sets a header.
    #
    # CSP notes:
    #   - script-src hashes the inline theme-preseed script in index.html (no 'unsafe-inline').
    #     That hash MUST be recomputed if the script's content changes — see the sync comment
    #     next to it in index.html. A stale hash silently drops back to light mode with a CSP
    #     violation in the console, not a broken page, so it's easy to miss.
    #   - style-src needs 'unsafe-inline': dnd-kit sets inline style="" transforms during drag
    #     (BudgetGroupCard.tsx, LineItemRow.tsx) and there is no hash/nonce mechanism for
    #     inline style *attributes* (only for <style> elements), so this can't be tightened.
    #   - connect-src allows the backend on its fixed port (5062) across any LAN host, not one
    #     pinned origin: the frontend's backend URL (VITE_API_BASE_URL) is baked into the JS
    #     bundle at Docker build time and isn't available to this static nginx.conf at runtime,
    #     so the exact host can't be substituted in here without adding envsubst templating.
    #     The port is fixed by docker-compose.yml across dev/deploy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2+dKxxLXJCVT9VqSQgLekaHdTj1mrqvzlDwXbcWz5Bs='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' http://*:5062; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # The SPA shell. Both the `index` directive and the try_files fallback below reach this
    # location by internal redirect, so deep links like /accounts/1 are covered too.
    # "no-cache" means "revalidate", not "don't store" — a 304 is still allowed, so this is cheap.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2+dKxxLXJCVT9VqSQgLekaHdTj1mrqvzlDwXbcWz5Bs='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' http://*:5062; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # Vite content-hashes these filenames, so changed content is always a changed URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2+dKxxLXJCVT9VqSQgLekaHdTj1mrqvzlDwXbcWz5Bs='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' http://*:5062; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    # Self-hosted fonts are hand-versioned, not content-hashed — a year of immutable caching
    # would make a font swap unevictable, so this gets a shorter TTL than /assets/.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
