services:
  backend:
    build: ./backend/Dollars2.Api
    ports:
      - "5062:8080"
      - "5063:8443"
    volumes:
      # TLS cert for the https endpoint below — passkeys (WebAuthn) require a secure context.
      # Private-CA leaf for the Tailscale hostname; see E:\ca\claw-cert-notes.md on the CA host.
      - ./certs:/certs:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      Kestrel__Certificates__Default__Path: /certs/claw.crt
      Kestrel__Certificates__Default__KeyPath: /certs/claw.key
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__Issuer: Dollars2
      Jwt__Audience: Dollars2
      Cors__FrontendUrl: ${Cors__FrontendUrl}
      Identity__ServerDomain: ${Identity__ServerDomain}
      Serilog__MinimumLevel: ${Serilog__MinimumLevel:-Information}
      Plaid__ClientId: ${Plaid__ClientId}
      Plaid__Secret: ${Plaid__Secret}
      Plaid__Environment: Production
      Plaid__Enabled: ${Plaid__Enabled:-false}
      SimpleFin__Enabled: ${SimpleFin__Enabled:-false}
      Elasticsearch__Uri: http://elasticsearch:9200
      DynamoDb__ServiceUrl: http://dynamodb:8000
    depends_on:
      elasticsearch:
        condition: service_started
      # Wait for DynamoDB to actually answer, not just for the container to exist. The table
      # initializer runs once at startup, so losing this race would leave the archive table
      # uncreated and every archive write failing silently.
      dynamodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_BUILD_ID: ${VITE_BUILD_ID:-dev}
        VITE_KIBANA_URL: ${VITE_KIBANA_URL}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # Same cert as the backend service above — see the note there.
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  # Log sink for the backend. Single-node with security disabled: this stack is only reachable on
  # the home LAN / Tailscale network, never the public internet, so TLS + auth are out of scope.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Cap the heap so Elasticsearch fits comfortably on the small home server.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  # Kibana: browse and search the logs Elasticsearch collects.
  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Archive of the raw JSON returned by the bank sync providers (SimpleFIN, Plaid). Runs the
  # dynamodb-local container in production too — there is no AWS account behind this, so no
  # credentials, IAM, billing, or egress are involved. LAN/Tailscale only, like the rest of the stack.
  #
  # Three settings below look wrong and are not; all three were verified against the image:
  #   user: root      /home/dynamodblocal/data does not exist in the image, so Docker creates the
  #                   volume mount point as root while the container's default user is uid 1000.
  #                   Without this the container starts, reports healthy, and silently persists
  #                   nothing.
  #   -dbPath ./data  The absolute path fails outright with "Invalid directory for database
  #                   creation."; the relative form resolves against the image's workdir.
  #   curl (no -f)    A bare GET / returns HTTP 400, so -f would mark the container permanently
  #                   unhealthy and the backend would never start. The image ships curl and bash
  #                   but no wget or nc.
  #
  # The image's entrypoint is already `java`, so `command` supplies arguments only. Its default
  # -inMemory must be overridden or the archive is discarded on every restart.
  dynamodb:
    image: amazon/dynamodb-local
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath ./data
    volumes:
      - dynamodata:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Browse/edit the sync archive table by hand. dynamodb-local has no AWS account behind it, so
  # the "local"/"local" credentials below are throwaway, same as the ones Program.cs hardcodes for
  # the backend's own client.
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    ports:
      - "8001:8001"
    depends_on:
      dynamodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  esdata:
  dynamodata:
